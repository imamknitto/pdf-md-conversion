[project]
name = "doc-md-conversion"
version = "0.1.0"
description = "REST API + CLI untuk konversi PDF ke Markdown (PyMuPDF, pdfplumber, RapidOCR)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "pillow>=10",
    "pdfplumber>=0.11",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "rapidocr-onnxruntime>=1.2",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
doc-md-conversion = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
